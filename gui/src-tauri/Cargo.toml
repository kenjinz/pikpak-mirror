[package]
name = "pikpak-backup"
version = "0.2.0"
description = "PikPak Backup desktop app (thin shell over the PikPak Mirror PowerShell engine)"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-ico"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
strip = true
