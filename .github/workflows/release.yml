name: Release

# Push a tag like v0.1.0 to test, build the single .exe and publish it as a GitHub Release.
# "Run workflow" (workflow_dispatch) does the same build and test but publishes nothing: the .exe is
# kept as a build artifact on the run page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        id: version
        shell: pwsh
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '' }
          $version = if ($tag) { & .github/scripts/check-version.ps1 -Tag $tag } else { & .github/scripts/check-version.ps1 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run the PowerShell tests (Pester 5.7.1, Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
          .\tests\run.ps1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: Run the Rust tests
        run: cargo test --manifest-path gui/src-tauri/Cargo.toml

      - name: Install the Tauri CLI
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --version "^2.12" --locked
          }

      # --no-bundle: just the app .exe (no installer). A bare `cargo build --release` would give a
      # dev-mode window that looks for a dev server.
      - name: Build the app
        working-directory: gui/src-tauri
        run: cargo tauri build --no-bundle

      - name: Name the file and write its SHA-256
        shell: pwsh
        run: |
          $name = 'PikPak-Sync-v${{ steps.version.outputs.version }}-windows-x64.exe'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item gui/src-tauri/target/release/pikpak-backup.exe "dist/$name"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name").Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/dist/$name.sha256", "$hash  $name`n")
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  publish:
    # Only for a pushed tag; a manual run stops after build.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.exe dist/*.sha256 \
            --title "PikPak Sync $TAG" \
            --notes-file .github/release-notes.md \
            --verify-tag
